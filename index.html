<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHREE S K PATEL ITI KADI - ID Card</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script src="data.js"></script>
</head>
<body>
<header><h1>SHREE S K PATEL ITI KADI</h1><p>GIA-509 · Permanent Trainee ID Card System</p></header>
<main>
<section class="panel">
<div class="topline"><strong id="dbStatus">Permanent database: loading…</strong><button id="resetDb" class="small secondary">Reset to GitHub Data</button></div>
<div class="grid2">
<label>Update Excel (optional)<input id="excelFile" type="file" accept=".xlsx,.xls,.csv"></label>
<label>Student Photos<input id="photoFiles" type="file" accept="image/*" multiple></label>
</div>
<div class="grid3">
<label>Search<input id="search" placeholder="Name / Enrollment / Roll No."></label>
<label>Trade<select id="tradeFilter"><option value="">All trades</option></select></label>
<label>Student<select id="studentSelect"></select></label>
</div>
<div class="actions">
<button id="previewBtn">Preview</button><button id="printBtn">Print Selected</button>
<button id="bulkBtn">Bulk Print</button><button id="pdfBtn">Selected PDF</button>
<button id="allPdfBtn">All Filtered PDF</button><button id="saveDb" class="secondary">Save Excel Update</button>
</div>
<div class="selectline"><label><input id="selectAll" type="checkbox"> Select all filtered</label><b id="count"></b></div>
<div id="studentList" class="student-list"></div>
<p id="status">Permanent student data is built into this website.</p>
</section>

<section class="preview"><article id="idCard" class="id-card"></article></section>
<section id="printArea" class="print-area"></section>
</main>
<script src="script.js"></script>
</body></html>
